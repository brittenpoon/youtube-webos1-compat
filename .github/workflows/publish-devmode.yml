name: Publish Developer Mode compatibility bundle
on:
  push:
    branches: [main]
    paths:
      - 'releases/v0.5.3-devmode.1/**'
      - '.github/workflows/publish-devmode.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact committed release files
        env:
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          git init release-repo
          cd release-repo
          git remote add origin "https://github.com/$REPO.git"
          git fetch --depth 1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          cd release-repo/releases/v0.5.3-devmode.1
          sha256sum -c SHA256SUMS
          if gh release view v0.5.3-devmode.1 >/dev/null 2>&1; then
            gh release edit v0.5.3-devmode.1 --prerelease=false --latest --notes-file RELEASE-NOTES.md
            exit 0
          fi
          gh release create v0.5.3-devmode.1 *.ipk *.zip SHA256SUMS --target "$COMMIT" --latest --title "0.5.3-devmode.1 — Developer Mode two-IPK bundle" --notes-file RELEASE-NOTES.md
